<!doctype html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Mayabon Poribar community website for members, events, notices, gallery, chat, and anonymous voting."
    />
    <title>মায়াবন পরিবার</title>
    <script>
      // GitHub Pages SPA redirect — preserve all query parameters
      var path = location.pathname.replace("/mayabonporibar/", "").replace(/^\//, "");
      var base = "/mayabonporibar/";
      var redirect = base;
      if (path && path !== "") {
        redirect = base + path + location.search + location.hash;
      } else if (location.search) {
        redirect = base + "complete-signup" + location.search;
      }
      sessionStorage.redirect = location.href;
      location.replace(redirect);
    </script>
  </head>
  <body>
    <p>Redirecting to Mayabon Poribar...</p>
  </body>
</html>
